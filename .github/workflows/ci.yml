name: Clockwork Scheduler CI & Package Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -Dmaven.compiler.showWarnings=true -Dmaven.compiler.showDeprecation=true

      - name: Archive Production JAR Package
        uses: actions/upload-artifact@v4
        with:
          name: clockwork-scheduler-package
          path: target/clockwork-scheduler-*.jar
          retention-days: 14
