server:
  port: ${SERVER_PORT:8085}

spring:
  datasource:
    url: jdbc:h2:mem:clockwork_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

org:
  jobrunr:
    background-job-server:
      enabled: true
      worker-count: 8
      poll-interval-in-seconds: 15
    dashboard:
      enabled: true
      port: 8000

app:
  alerts:
    webhook-url: ""
  s3:
    endpoint: http://localhost:9000
