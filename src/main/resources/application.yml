server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: clockwork-scheduler
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clockwork_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  thymeleaf:
    cache: false
    mode: HTML

# JobRunr Distributed Scheduler Configuration
org:
  jobrunr:
    background-job-server:
      enabled: true
      worker-count: 8
      poll-interval-in-seconds: 15
    dashboard:
      enabled: true
      port: 8000

# Observability, Micrometer & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: clockwork-scheduler

# Clockwork Business & Alerting Settings
app:
  alerts:
    webhook-url: ${APP_ALERT_WEBHOOK_URL:https://hooks.slack.com/services/mock/clockwork/alerts}
    dlq-threshold-hourly: 10
  s3:
    endpoint: ${APP_S3_ENDPOINT:http://localhost:9000}
    access-key: ${APP_S3_ACCESS_KEY:minioadmin}
    secret-key: ${APP_S3_SECRET_KEY:minioadmin}
    region: us-east-1
  database:
    host: ${SPRING_DATASOURCE_HOST:localhost}
    port: ${SPRING_DATASOURCE_PORT:5432}
    name: clockwork_db
  storage:
    local-fallback-dir: ./storage-data
  security:
    admin:
      username: admin
      password: admin123
