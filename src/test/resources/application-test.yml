spring:
  datasource:
    url: jdbc:h2:mem:clockwork_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

org:
  jobrunr:
    background-job-server:
      enabled: false
    dashboard:
      enabled: false

app:
  alerts:
    webhook-url: ""
  s3:
    endpoint: http://localhost:9000
